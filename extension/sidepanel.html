<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SignaLens</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        <div class="brand-copy">
          <h1>SignaLens</h1>
          <p>决定什么值得继续研究</p>
        </div>
        <span id="connection" class="connection" aria-live="polite">连接中</span>
      </header>

      <details id="settings" class="settings">
        <summary>研究设置 <span class="summary-note">Research Context</span></summary>
        <form id="context-form" class="settings-body">
          <label for="research-areas">Research Areas</label>
          <textarea id="research-areas" rows="2" placeholder="半导体、AI 基础设施"></textarea>
          <label for="watchlist">Watchlist</label>
          <textarea id="watchlist" rows="2" placeholder="NVDA、AVGO"></textarea>
          <label for="investment-horizon">Investment Horizon</label>
          <select id="investment-horizon">
            <option value="6_24m">6–24 个月</option>
            <option value="lt_6m">少于 6 个月</option>
            <option value="gt_24m">超过 24 个月</option>
          </select>
          <div class="settings-footer">
            <span id="context-status" role="status"></span>
            <button type="submit" class="text-button">保存设置</button>
          </div>
        </form>
      </details>

      <section class="input-section" aria-labelledby="input-heading">
        <div class="section-label">
          <span class="step">01</span>
          <h2 id="input-heading">输入信息</h2>
        </div>
        <div class="mode-switch" role="group" aria-label="输入方式">
          <button id="mode-text" class="mode active" type="button" aria-pressed="true">粘贴文本</button>
          <button id="mode-file" class="mode" type="button" aria-pressed="false">上传文件</button>
        </div>
        <div id="text-panel" class="input-panel">
          <label class="sr-only" for="information-text">需要评估的投研信息</label>
          <textarea id="information-text" rows="10" placeholder="粘贴公告、新闻、研报片段或行业信息…"></textarea>
        </div>
        <div id="file-panel" class="input-panel" hidden>
          <label for="information-file" class="file-drop">
            <span class="file-icon" aria-hidden="true">↑</span>
            <strong>选择 PDF、Word 或文本文件</strong>
            <small>TXT · MD · PDF · DOCX · DOC · 最多 20 MB</small>
          </label>
          <input id="information-file" type="file" accept=".txt,.md,.pdf,.docx,.doc">
          <p id="selected-file" class="selected-file" aria-live="polite"></p>
          <div id="page-choice" class="scope-choice" hidden>
            <label for="page-range">选择 PDF 页码</label>
            <input id="page-range" type="text" placeholder="例如 1-3,5">
          </div>
          <div id="section-choice" class="scope-choice" hidden>
            <label for="section-index">选择 Word 章节</label>
            <select id="section-index"></select>
          </div>
        </div>
        <p class="input-note">只评估本次提交的内容。文件默认评估整份文档的可提取文字。</p>
        <button id="evaluate" class="evaluate-button" type="button">Evaluate <span aria-hidden="true">↗</span></button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="result" class="result" aria-labelledby="result-heading" hidden>
        <div class="section-label">
          <span class="step">02</span>
          <h2 id="result-heading">判断结果</h2>
        </div>
        <div id="result-card" class="result-card">
          <div class="result-top">
            <strong id="decision-label"></strong>
            <button id="copy-result" class="text-button" type="button">复制</button>
          </div>
          <p id="confidence" class="confidence"></p>
          <p id="result-message" class="result-message"></p>
          <p id="scope" class="scope"></p>
          <p id="warning" class="warning" hidden></p>
        </div>
      </section>

      <footer class="footer">
        <p>仅用于研究优先级筛选，不核实事实或提供投资建议。</p>
        <p>提交的文字将发送至 Jev 服务评估，请只上传有权处理的内容。</p>
      </footer>
    </main>
  </body>
</html>
